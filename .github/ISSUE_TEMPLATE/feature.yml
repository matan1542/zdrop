name: Idea
description: Suggest a feature or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like zdrop to do?
      description: The situation it helps with matters more than the exact solution.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: How you work around it today

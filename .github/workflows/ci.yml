name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - name: yarn.lock names no private registry
        # run scripts/clean-lockfile.sh after changing dependencies
        run: "! grep -q __archiveUrl yarn.lock"
      - name: zsh, tmux and bubblewrap (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q && sudo apt-get install -yq zsh tmux bubblewrap man-db
          # Ubuntu 24.04 restricts unprivileged user namespaces (AppArmor), which bubblewrap needs;
          # lift it so the sandbox is tested too
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --ro-bind / / --dev /dev --unshare-net --unshare-ipc --unshare-pid -- /bin/true && echo "bubblewrap works"
      - name: tmux (macOS)
        if: runner.os == 'macOS'
        run: brew install tmux
      - run: yarn install --immutable
      - run: yarn build
      - run: yarn typecheck
      - run: yarn test
      - run: yarn setup-test
      - name: End-to-end (zsh in tmux)
        run: yarn e2e
      - name: Package, install and query the Linux tarball
        if: runner.os == 'Linux'
        run: |
          scripts/package.sh linux-x64
          version=$(node -p 'require("./package.json").version')
          home=$(mktemp -d)
          env -i HOME="$home" PATH=/usr/bin:/bin ZDROP_NO_LOGIN=1 ZDROP_TARBALL="$PWD/release/zdrop-$version-linux-x64.tar.xz" sh release/install.sh
          grep -q "$home/.zdrop/current/zsh/zdrop.plugin.zsh" "$home/.zshrc"
          env -i HOME="$home" PATH=/usr/bin:/bin "$home/.zdrop/current/bin/zdrop" query "git ch" | grep -q checkout
          env -i HOME="$home" PATH=/usr/bin:/bin "$home/.zdrop/current/bin/zdrop" doctor --markdown
          # the login item without a systemd user session: a note, not a failure
          env -i HOME="$home" PATH=/usr/bin:/bin ZDROP_NO_RC=1 "$home/.zdrop/current/bin/zdrop" setup

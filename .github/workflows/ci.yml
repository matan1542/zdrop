name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - name: Resolve from the public npm registry
        # yarn.lock is generated through a private npm mirror; drop its archive URLs so the runner
        # fetches the same packages (same checksums) from registry.npmjs.org
        run: sed -i '' -E 's/::__archiveUrl=[^"]*//; s/%3A%3A__archiveUrl=[^#"]*//g' yarn.lock
      - run: yarn install --immutable
      - run: yarn build
      - run: yarn typecheck
      - run: yarn test
      - name: End-to-end (zsh in tmux)
        run: |
          brew install tmux
          yarn e2e

name: Demo GIF

# Re-records docs/demo.gif (scripts/demo.sh + docs/demo.tape) for each release, or on demand, and
# commits it when it changed.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  record:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn build
      - run: brew install vhs
      - run: scripts/demo.sh
      - name: Commit if changed
        run: |
          git diff --quiet -- docs/demo.gif && { echo "unchanged"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/demo.gif
          git commit -m "Re-record the demo GIF"
          git push

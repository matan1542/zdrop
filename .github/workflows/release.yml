name: Release

# Push a tag that matches package.json's version (e.g. v0.2.0) to publish a release with
# self-contained tarballs for Apple silicon and Intel Macs, their checksums, and install.sh.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - name: Resolve from the public npm registry
        # yarn.lock is generated through a private npm mirror; drop its archive URLs so the runner
        # fetches the same packages (same checksums) from registry.npmjs.org
        run: sed -i '' -E 's/::__archiveUrl=[^"]*//; s/%3A%3A__archiveUrl=[^#"]*//g' yarn.lock
      - run: yarn install --immutable
      - name: Tag matches package.json
        run: |
          version=$(node -p 'require("./package.json").version')
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != package.json v$version"; exit 1; }
      - run: yarn build
      - run: yarn test
      - run: scripts/package.sh arm64 x64
      - name: Smoke-test the arm64 tarball
        run: |
          home=$(mktemp -d)
          env -i HOME="$home" PATH=/usr/bin:/bin ZDROP_NO_RC=1 ZDROP_TARBALL="$PWD/release/zdrop-${GITHUB_REF_NAME#v}-darwin-arm64.tar.gz" sh release/install.sh
          env -i HOME="$home" PATH=/usr/bin:/bin "$home/.zdrop/current/bin/zdrop" query "git ch" | grep -q checkout
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --title "zdrop ${GITHUB_REF_NAME#v}" \
            --notes "Install or update on macOS (Apple silicon or Intel):

          \`\`\`sh
          curl -fsSL https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/install.sh | sh
          \`\`\`

          Then open a new terminal tab. Each tarball bundles its own Node.js; no other dependencies are needed."
